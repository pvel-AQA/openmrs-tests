services:
  backend:
    image: openmrs/openmrs-reference-application-3-gateway:qa
    volumes:
      - ./empty-ocl:/openmrs/distribution/openmrs_config/ocl:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: openmrs
      OMRS_CONFIG_CONNECTION_PASSWORD: openmrs
      OMRS_JAVA_MEMORY_OPTS: "-Xms2g -Xmx3g"
    networks:
      - openMRS-tests-network

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:qa
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
    depends_on:
      - backend
    networks:
      - openMRS-tests-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - openMRS-tests-network

  db:
    image: mariadb:10.11.7
    environment:
      MARIADB_ROOT_PASSWORD: openmrs
      MARIADB_DATABASE: openmrs
      MARIADB_USER: openmrs
      MARIADB_PASSWORD: openmrs
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb -u openmrs -popenmrs -e 'SELECT 1;' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - openMRS-tests-network

  selenoid:
    image: aerokube/selenoid:1.11.3
    environment:
      DOCKER_API_VERSION: "1.40"
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/browsers.json:/etc/selenoid/browsers.json:ro
    command: ["-container-network", "openMRS-tests-network"]
    depends_on:
      - nginx
    networks:
      - openMRS-tests-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "6567:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - openMRS-tests-network

networks:
  openMRS-tests-network:
    name: openMRS-tests-network