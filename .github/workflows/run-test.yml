name: Run tests
on: [push, workflow_dispatch]
jobs:
  run-test:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up services
        run: bash infrastructure/docker_compose/restart_docker.sh

      - name: Wait for OpenMRS to finish initial setup
        run: |
          echo "Waiting for OpenMRS to complete initial setup..."
          for i in {1..240}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -u admin:Admin123 \
              -H "Accept: application/json" \
              http://localhost/openmrs/ws/rest/v1/session)
            if [ "$status" = "200" ]; then
              echo "OpenMRS is ready (after $((i*5))s)."
              exit 0
            fi
            echo "Attempt $i: status=$status (still initializing)..."
            # Every 12 attempts (~1 min), peek at backend log tail
            if (( i % 12 == 0 )); then
              echo "--- backend log tail at $((i*5))s ---"
              docker compose -f infrastructure/docker_compose/docker-compose.yml logs --tail=20 backend
              echo "--- end backend log tail ---"
            fi
            sleep 5
          done
          echo "OpenMRS did not become ready within 20 minutes"
          docker compose -f infrastructure/docker_compose/docker-compose.yml logs --tail=300 backend
          exit 1

      - name: Run tests
        env:
          BROWSERREMOTE: http://localhost:4444/wd/hub
          UIBASEURL: http://localhost/openmrs/spa
          APIBASEURL: http://localhost:80/openmrs
        run: mvn -B -ntp test -P api,ui

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/
            target/site/

      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/docker_compose/docker-compose.yml down