name: Run tests

# trigger
on: [ push, workflow_dispatch ]

# stages analogy
jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # copy files into CI agent
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: |
          cd infra/docker_compose
          bash restart_docker.sh
          cd ../..
          
      - name: Wait for OpenMRS to be ready
        timeout-minutes: 25
        run: |
          echo "Waiting for OpenMRS REST API..."
          for i in $(seq 1 150); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -u admin:Admin123 \
              http://localhost/openmrs/ws/rest/v1/session)
            if [ "$STATUS" = "200" ]; then
              echo "OpenMRS is ready!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "OpenMRS not ready after 25 minutes"
          exit 1 

      - name: Run tests
        run: ./mvnw clean test -P ui -q
        env:
          APIBASEURL: http://localhost:80/openmrs
          UIBASEURL: http://gateway/openmrs/spa
          BROWSERREMOTE: http://localhost:4444/wd/hub
          APIFULLPREFIX: http://localhost/openmrs/ws/rest/v1

      - name: Run Swagger Coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s openmrs-swagger.json -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v6
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.14
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Build Swagger Coverage report
        if: always()
        run: sudo cp swagger-coverage-report.html allure-history/${{ github.run_number }}

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p openmrs down
