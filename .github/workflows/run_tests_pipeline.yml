name: Run tests

# trigger
on: [ push, workflow_dispatch ]

# stages analogy
jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # copy files into CI agent
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up services
        run: |
          cd infra/docker_compose
          bash restart_docker.sh
          cd ../..
          
      - name: Wait for OpenMRS to be ready
        timeout-minutes: 12
        run: |
          echo "Waiting for OpenMRS REST API..."
          for i in $(seq 1 150); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -u admin:Admin123 \
              http://localhost/openmrs/ws/rest/v1/session)
            if [ "$STATUS" = "200" ]; then
              echo "OpenMRS is ready!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "OpenMRS not ready after 25 minutes"
          exit 1 

      - name: Run tests
        env:
          APIBASEURL: http://localhost:80/openmrs
          UIBASEURL: http://gateway/openmrs/spa
          BROWSERREMOTE: http://localhost:4444/wd/hub
          APIFULLPREFIX: http://localhost/openmrs/ws/rest/v1
        run: ./mvnw clean test -P api -q

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose -p openmrs down
